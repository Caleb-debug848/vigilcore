<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 880" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Segoe UI', Calibri, Arial, sans-serif;">
    <defs>
        <!-- Filtre ombre douce  -->
        <filter id="shadow-dep" x="-10%" y="-10%" width="130%" height="130%">
            <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.12"/>
        </filter>
    </defs>

    <!-- CADRE GÉNÉRAL DU DIAGRAMME DE DÉPLOIEMENT POWERAMC -->
    <rect x="20" y="20" width="1340" height="840" rx="8" ry="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow-dep)"/>
    
    <!-- BANDEAU DE TITRE UML POWERAMC -->
    <path d="M 20 20 L 710 20 L 735 48 L 710 48 L 20 48 Z" fill="#0020B2"/>
    <text x="35" y="37" fill="#ffffff" font-size="14" font-weight="bold" letter-spacing="0.5">
        dep : Déploiement — Cas 1 : Infrastructure de Production &amp; Alertes (VigilCore)
    </text>

    <!-- ========================================================================= -->
    <!-- NŒUD 1 : POSTE CLIENT (NAVIGATEUR WEB SUPERVISION)                        -->
    <!-- Position: X=50, Y=90 | L=300, H=240, Profondeur 3D=18                    -->
    <!-- ========================================================================= -->
    <g transform="translate(50, 90)" filter="url(#shadow-dep)">
        <polygon points="0 18, 18 0, 318 0, 300 18" fill="#bae6fd" stroke="#0284c7" stroke-width="1.4"/>
        <polygon points="300 18, 318 0, 318 242, 300 260" fill="#7dd3fc" stroke="#0284c7" stroke-width="1.4"/>
        <rect x="0" y="18" width="300" height="242" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.4"/>
        <text x="150" y="38" fill="#0369a1" font-size="11" font-style="italic" text-anchor="middle">&lt;&lt;device&gt;&gt;</text>
        <text x="150" y="54" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">Poste Opérateur / Admin</text>
        
        <!-- Composant 1 : Navigateur Web -->
        <g transform="translate(20, 75)">
            <rect x="15" y="0" width="245" height="64" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
            <rect x="5" y="10" width="20" height="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
            <rect x="5" y="36" width="20" height="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
            <text x="140" y="26" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Navigateur Web (Chrome/Edge)</text>
            <text x="140" y="47" fill="#334155" font-size="10.5" text-anchor="middle">Tableau de bord dynamique Livewire</text>
        </g>

        <!-- Composant 2 : Dashboard SPA & Statuspage -->
        <g transform="translate(20, 155)">
            <rect x="15" y="0" width="245" height="64" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
            <rect x="5" y="10" width="20" height="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
            <rect x="5" y="36" width="20" height="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
            <text x="140" y="26" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Console de Supervision en Direct</text>
            <text x="140" y="47" fill="#334155" font-size="10.5" text-anchor="middle">Actualisation 5s &amp; Alertes instantanées</text>
        </g>
    </g>


    <!-- LIAISON 1 : CLIENT -> REVERSE PROXY NGINX (HTTPS / TLS 1.3) -->
    <line x1="368" y1="210" x2="470" y2="210" stroke="#000000" stroke-width="1.8"/>
    <text x="419" y="198" fill="#0020B2" font-size="11" font-weight="bold" text-anchor="middle">&lt;&lt;protocol&gt;&gt;</text>
    <text x="419" y="228" fill="#000000" font-size="10.5" font-weight="bold" text-anchor="middle">HTTPS (443)</text>


    <!-- ========================================================================= -->
    <!-- NŒUD 2 : SERVEUR REVERSE PROXY & WAF (NGINX)                              -->
    <!-- Position: X=470, Y=90 | L=290, H=240, Profondeur 3D=18                   -->
    <!-- ========================================================================= -->
    <g transform="translate(470, 90)" filter="url(#shadow-dep)">
        <polygon points="0 18, 18 0, 308 0, 290 18" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
        <polygon points="290 18, 308 0, 308 242, 290 260" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.4"/>
        <rect x="0" y="18" width="290" height="242" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
        <text x="145" y="38" fill="#15803d" font-size="11" font-style="italic" text-anchor="middle">&lt;&lt;device&gt;&gt;</text>
        <text x="145" y="54" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">Serveur Web &amp; Sécurité NGINX</text>
        
        <!-- Composant NGINX -->
        <g transform="translate(18, 75)">
            <rect x="15" y="0" width="235" height="64" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
            <rect x="5" y="10" width="20" height="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
            <rect x="5" y="36" width="20" height="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
            <text x="135" y="26" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">NGINX Reverse Proxy</text>
            <text x="135" y="47" fill="#334155" font-size="10.5" text-anchor="middle">Chiffrement SSL &amp; Répartition de charge</text>
        </g>

        <!-- Composant WAF -->
        <g transform="translate(18, 155)">
            <rect x="15" y="0" width="235" height="64" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
            <rect x="5" y="10" width="20" height="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
            <rect x="5" y="36" width="20" height="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
            <text x="135" y="26" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Pare-Feu WAF &amp; Sécurité</text>
            <text x="135" y="47" fill="#334155" font-size="10.5" text-anchor="middle">Protection anti-attaques &amp; abus</text>
        </g>
    </g>


    <!-- LIAISON 2 : NGINX -> SERVEUR LARAVEL (FastCGI / PHP-FPM) -->
    <line x1="778" y1="210" x2="880" y2="210" stroke="#000000" stroke-width="1.8"/>
    <text x="829" y="198" fill="#0020B2" font-size="11" font-weight="bold" text-anchor="middle">&lt;&lt;protocol&gt;&gt;</text>
    <text x="829" y="228" fill="#000000" font-size="10.5" font-weight="bold" text-anchor="middle">FastCGI (9000)</text>


    <!-- ========================================================================= -->
    <!-- NŒUD 3 : SERVEUR D'APPLICATION LARAVEL (VIGILCORE CORE)                   -->
    <!-- Position: X=880, Y=75 | L=430, H=340, Profondeur 3D=18                   -->
    <!-- ========================================================================= -->
    <g transform="translate(880, 75)" filter="url(#shadow-dep)">
        <polygon points="0 18, 18 0, 448 0, 430 18" fill="#fed7aa" stroke="#ea580c" stroke-width="1.4"/>
        <polygon points="430 18, 448 0, 448 342, 430 360" fill="#fdba74" stroke="#ea580c" stroke-width="1.4"/>
        <rect x="0" y="18" width="430" height="342" fill="#fff7ed" stroke="#ea580c" stroke-width="1.4"/>
        <text x="215" y="38" fill="#c2410c" font-size="11" font-style="italic" text-anchor="middle">&lt;&lt;execution environment&gt;&gt;</text>
        <text x="215" y="54" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">Serveur d'Application Laravel 11 / PHP 8.2</text>
        
        <!-- Composant VigilCore Monolith -->
        <g transform="translate(20, 70)">
            <rect x="15" y="0" width="375" height="54" fill="#ffffff" stroke="#ea580c" stroke-width="1.2"/>
            <rect x="5" y="8" width="20" height="12" fill="#fed7aa" stroke="#ea580c" stroke-width="1"/>
            <rect x="5" y="30" width="20" height="12" fill="#fed7aa" stroke="#ea580c" stroke-width="1"/>
            <text x="200" y="22" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Moteur Web VigilCore (Livewire 3)</text>
            <text x="200" y="40" fill="#334155" font-size="10.5" text-anchor="middle">Routage, sécurité des accès &amp; écrans</text>
        </g>

        <!-- Composant Moteur d'Incident & Boîte Noire -->
        <g transform="translate(20, 135)">
            <rect x="15" y="0" width="375" height="54" fill="#ffffff" stroke="#ea580c" stroke-width="1.2"/>
            <rect x="5" y="8" width="20" height="12" fill="#fed7aa" stroke="#ea580c" stroke-width="1"/>
            <rect x="5" y="30" width="20" height="12" fill="#fed7aa" stroke="#ea580c" stroke-width="1"/>
            <text x="200" y="22" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Gestionnaire des Pannes &amp; Diagnostic</text>
            <text x="200" y="40" fill="#334155" font-size="10.5" text-anchor="middle">Suivi des étapes de panne &amp; enregistrement des erreurs</text>
        </g>

        <!-- Composant Sondes HealthCheck -->
        <g transform="translate(20, 200)">
            <rect x="15" y="0" width="375" height="54" fill="#ffffff" stroke="#ea580c" stroke-width="1.2"/>
            <rect x="5" y="8" width="20" height="12" fill="#fed7aa" stroke="#ea580c" stroke-width="1"/>
            <rect x="5" y="30" width="20" height="12" fill="#fed7aa" stroke="#ea580c" stroke-width="1"/>
            <text x="200" y="22" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Moteur de Test des 20 Services</text>
            <text x="200" y="40" fill="#334155" font-size="10.5" text-anchor="middle">Vérification automatique (toutes les 30s) des banques</text>
        </g>

        <!-- Composant Queue Worker -->
        <g transform="translate(20, 265)">
            <rect x="15" y="0" width="375" height="54" fill="#ffffff" stroke="#ea580c" stroke-width="1.2"/>
            <rect x="5" y="8" width="20" height="12" fill="#fed7aa" stroke="#ea580c" stroke-width="1"/>
            <rect x="5" y="30" width="20" height="12" fill="#fed7aa" stroke="#ea580c" stroke-width="1"/>
            <text x="200" y="22" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Gestionnaire des Tâches en Arrière-Plan</text>
            <text x="200" y="40" fill="#334155" font-size="10.5" text-anchor="middle">Envoi immédiat des alertes vers n8n</text>
        </g>
    </g>


    <!-- ========================================================================= -->
    <!-- NŒUD 4 : SERVEUR DE PERSISTANCE & CACHE (POSTGRESQL & REDIS)              -->
    <!-- Position: X=880, Y=480 | L=430, H=290, Profondeur 3D=18                  -->
    <!-- ========================================================================= -->
    <g transform="translate(880, 480)" filter="url(#shadow-dep)">
        <polygon points="0 18, 18 0, 448 0, 430 18" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1.4"/>
        <polygon points="430 18, 448 0, 448 292, 430 310" fill="#c4b5fd" stroke="#7c3aed" stroke-width="1.4"/>
        <rect x="0" y="18" width="430" height="292" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/>
        <text x="215" y="38" fill="#6d28d9" font-size="11" font-style="italic" text-anchor="middle">&lt;&lt;device&gt;&gt;</text>
        <text x="215" y="54" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">Serveur de Données &amp; Cache Dédié</text>
        
        <!-- Composant PostgreSQL -->
        <g transform="translate(20, 75)">
            <rect x="15" y="0" width="375" height="68" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
            <rect x="5" y="10" width="20" height="12" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1"/>
            <rect x="5" y="38" width="20" height="12" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1"/>
            <text x="200" y="25" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Base PostgreSQL 16 (Données)</text>
            <text x="200" y="47" fill="#334155" font-size="10.5" text-anchor="middle">Historique des pannes, durées d'arrêt &amp; rapports</text>
        </g>

        <!-- Composant Redis -->
        <g transform="translate(20, 160)">
            <rect x="15" y="0" width="375" height="68" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
            <rect x="5" y="10" width="20" height="12" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1"/>
            <rect x="5" y="38" width="20" height="12" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1"/>
            <text x="200" y="25" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Mémoire Rapide Redis (Cache)</text>
            <text x="200" y="47" fill="#334155" font-size="10.5" text-anchor="middle">Files de messages, sessions &amp; état des voyants</text>
        </g>
    </g>

    <!-- LIAISON 3 : LARAVEL -> POSTGRESQL & REDIS (VERTICALE DIRECTE) -->
    <line x1="1095" y1="435" x2="1095" y2="498" stroke="#000000" stroke-width="1.8"/>
    <text x="1155" y="458" fill="#0020B2" font-size="11" font-weight="bold">&lt;&lt;TCP/IP&gt;&gt;</text>
    <text x="1155" y="474" fill="#000000" font-size="10" font-weight="bold">PostgreSQL (5432) / Redis (6379)</text>


    <!-- ========================================================================= -->
    <!-- NŒUD 5 : SERVEUR D'ORCHESTRATION & NOTIFICATIONS (NODE.JS / N8N)          -->
    <!-- Position: X=470, Y=480 | L=340, H=290, Profondeur 3D=18                  -->
    <!-- ========================================================================= -->
    <g transform="translate(470, 480)" filter="url(#shadow-dep)">
        <polygon points="0 18, 18 0, 358 0, 340 18" fill="#fbcfe8" stroke="#db2777" stroke-width="1.4"/>
        <polygon points="340 18, 358 0, 358 292, 340 310" fill="#f472b6" stroke="#db2777" stroke-width="1.4"/>
        <rect x="0" y="18" width="340" height="292" fill="#fdf2f8" stroke="#db2777" stroke-width="1.4"/>
        <text x="170" y="38" fill="#be185d" font-size="11" font-style="italic" text-anchor="middle">&lt;&lt;execution environment&gt;&gt;</text>
        <text x="170" y="54" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">Serveur d'Envoi d'Alertes n8n</text>
        
        <!-- Composant n8n Core Engine -->
        <g transform="translate(18, 75)">
            <rect x="15" y="0" width="290" height="68" fill="#ffffff" stroke="#db2777" stroke-width="1.2"/>
            <rect x="5" y="10" width="20" height="12" fill="#fbcfe8" stroke="#db2777" stroke-width="1"/>
            <rect x="5" y="38" width="20" height="12" fill="#fbcfe8" stroke="#db2777" stroke-width="1"/>
            <text x="160" y="25" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Moteur de Scénarios n8n</text>
            <text x="160" y="47" fill="#334155" font-size="10.5" text-anchor="middle">Réception du signal d'alerte &amp; routage</text>
        </g>

        <!-- Composant WhatsApp Dispatcher -->
        <g transform="translate(18, 160)">
            <rect x="15" y="0" width="290" height="68" fill="#ffffff" stroke="#db2777" stroke-width="1.2"/>
            <rect x="5" y="10" width="20" height="12" fill="#fbcfe8" stroke="#db2777" stroke-width="1"/>
            <rect x="5" y="38" width="20" height="12" fill="#fbcfe8" stroke="#db2777" stroke-width="1"/>
            <text x="160" y="25" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Connecteurs WhatsApp &amp; Page Web</text>
            <text x="160" y="47" fill="#334155" font-size="10.5" text-anchor="middle">Envoi sur les téléphones de garde</text>
        </g>
    </g>

    <!-- LIAISON 4 : LARAVEL -> N8N (CORRIDOR OUVERT À Y=445) -->
    <path d="M 880 370 L 640 370 L 640 498" fill="none" stroke="#000000" stroke-width="1.8"/>
    <text x="760" y="360" fill="#0020B2" font-size="11" font-weight="bold" text-anchor="middle">&lt;&lt;REST Webhook HTTPS&gt;&gt;</text>


    <!-- ========================================================================= -->
    <!-- NŒUD 6 : SERVICES CLOUD TIERS & PASSERELLES PARTENAIRES                   -->
    <!-- Position: X=50, Y=480 | L=320, H=290, Profondeur 3D=18                    -->
    <!-- ========================================================================= -->
    <g transform="translate(50, 480)" filter="url(#shadow-dep)">
        <polygon points="0 18, 18 0, 338 0, 320 18" fill="#e2e8f0" stroke="#475569" stroke-width="1.4"/>
        <polygon points="320 18, 338 0, 338 292, 320 310" fill="#cbd5e1" stroke="#475569" stroke-width="1.4"/>
        <rect x="0" y="18" width="320" height="292" fill="#f8fafc" stroke="#475569" stroke-width="1.4"/>
        <text x="160" y="38" fill="#475569" font-size="11" font-style="italic" text-anchor="middle">&lt;&lt;cloud / external&gt;&gt;</text>
        <text x="160" y="54" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">Passerelles Bancaires &amp; Services Cloud</text>
        
        <!-- Composant Passerelles 20 Services -->
        <g transform="translate(18, 75)">
            <rect x="15" y="0" width="270" height="68" fill="#ffffff" stroke="#475569" stroke-width="1.2"/>
            <rect x="5" y="10" width="20" height="12" fill="#e2e8f0" stroke="#475569" stroke-width="1"/>
            <rect x="5" y="38" width="20" height="12" fill="#e2e8f0" stroke="#475569" stroke-width="1"/>
            <text x="150" y="25" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">20 Passerelles Services Partenaires</text>
            <text x="150" y="47" fill="#334155" font-size="10.5" text-anchor="middle">MoMo, Wave, Visa, Orange, UBA...</text>
        </g>

        <!-- Composant Meta & Atlassian -->
        <g transform="translate(18, 160)">
            <rect x="15" y="0" width="270" height="68" fill="#ffffff" stroke="#475569" stroke-width="1.2"/>
            <rect x="5" y="10" width="20" height="12" fill="#e2e8f0" stroke="#475569" stroke-width="1"/>
            <rect x="5" y="38" width="20" height="12" fill="#e2e8f0" stroke="#475569" stroke-width="1"/>
            <text x="150" y="25" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Meta WhatsApp &amp; Page Publique</text>
            <text x="150" y="47" fill="#334155" font-size="10.5" text-anchor="middle">Services externes de diffusion</text>
        </g>
    </g>

    <!-- LIAISON 5 : N8N -> SERVICES TIERS (HORIZONTAL DIRECT BAS) -->
    <line x1="470" y1="630" x2="388" y2="630" stroke="#000000" stroke-width="1.8"/>
    <text x="429" y="618" fill="#0020B2" font-size="11" font-weight="bold" text-anchor="middle">&lt;&lt;HTTPS API&gt;&gt;</text>
    <text x="429" y="648" fill="#000000" font-size="10" font-weight="bold" text-anchor="middle">Meta / Status</text>

    <!-- LIAISON 6 : LARAVEL -> PASSERELLES PARTENAIRES (CORRIDOR OUVERT À Y=415, ZÉRO CROISEMENT DE NŒUD) -->
    <path d="M 880 400 L 210 400 L 210 498" fill="none" stroke="#000000" stroke-width="1.8"/>
    <text x="360" y="390" fill="#0020B2" font-size="11" font-weight="bold" text-anchor="middle">&lt;&lt;HTTP / HTTPS Probes 30s&gt;&gt;</text>

</svg>
