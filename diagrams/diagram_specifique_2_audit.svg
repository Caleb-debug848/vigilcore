<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Segoe UI', Calibri, Arial, sans-serif;">
    <defs>
        <filter id="drop-shadow-s2" x="-10%" y="-10%" width="130%" height="130%">
            <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.10"/>
        </filter>
        <filter id="actor-shadow-s2" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.12"/>
        </filter>
        <marker id="arrow-open-s2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
            <path d="M 0 1.5 L 9 5 L 0 8.5" fill="none" stroke="#0020B2" stroke-width="1.6" stroke-linecap="round"/>
        </marker>
        <marker id="arrow-extend-s2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
            <path d="M 0 1.5 L 9 5 L 0 8.5" fill="none" stroke="#7c3aed" stroke-width="1.6" stroke-linecap="round"/>
        </marker>
    </defs>

    <!-- CADRE DU SOUS-SYSTÈME (POWERAMC BOUNDARY) -->
    <rect x="250" y="35" width="720" height="760" rx="10" ry="10" fill="#f8fafc" stroke="#0020B2" stroke-width="2.5" filter="url(#drop-shadow-s2)"/>
    
    <path d="M 610 35 L 970 35 L 970 73 L 595 73 Z" fill="#0020B2"/>
    <text x="782" y="60" fill="#ffffff" font-size="13.5" font-weight="bold" text-anchor="middle" letter-spacing="0.5">
        Sous-Système : Audit &amp; Rapports SLA
    </text>

    <!-- ACTEUR HUMAIN : Utilisateur Interne (Tout collaborateur connecté) -->
    <g transform="translate(60, 380)" filter="url(#actor-shadow-s2)">
        <circle cx="40" cy="18" r="16" fill="#ffffff" stroke="#000000" stroke-width="2"/>
        <line x1="40" y1="34" x2="40" y2="74" stroke="#000000" stroke-width="2"/>
        <line x1="12" y1="50" x2="68" y2="50" stroke="#000000" stroke-width="2"/>
        <line x1="40" y1="74" x2="16" y2="108" stroke="#000000" stroke-width="2"/>
        <line x1="40" y1="74" x2="64" y2="108" stroke="#000000" stroke-width="2"/>
        <text x="40" y="128" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Utilisateur Interne</text>
        <text x="40" y="144" fill="#475569" font-size="10.5" text-anchor="middle">(Support / SLA / Direction)</text>
    </g>

    <!-- CAS D'UTILISATION (COLONNE 1 : INTERACTIONS, CENTRE X = 450) -->

    <!-- CUS 2.1 : S'authentifier -->
    <g transform="translate(450, 100)" filter="url(#drop-shadow-s2)">
        <ellipse cx="0" cy="0" rx="95" ry="25" fill="#ffffff" stroke="#000000" stroke-width="2"/>
        <text x="0" y="5" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">S'authentifier</text>
    </g>

    <!-- CUS 2.2 : Consulter métriques SLA -->
    <g transform="translate(450, 260)" filter="url(#drop-shadow-s2)">
        <ellipse cx="0" cy="0" rx="145" ry="30" fill="#ffffff" stroke="#000000" stroke-width="2"/>
        <text x="0" y="-3" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Consulter la disponibilité</text>
        <text x="0" y="14" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">SLA et durée de coupure</text>
    </g>

    <!-- CUS 2.3 : Générer et exporter les rapports d'audit SLA -->
    <g transform="translate(450, 440)" filter="url(#drop-shadow-s2)">
        <ellipse cx="0" cy="0" rx="155" ry="32" fill="#ffffff" stroke="#000000" stroke-width="2"/>
        <text x="0" y="-4" fill="#000000" font-size="12.5" font-weight="bold" text-anchor="middle">Générer et exporter les</text>
        <text x="0" y="15" fill="#000000" font-size="12.5" font-weight="bold" text-anchor="middle">rapports d'audit SLA (Excel / PDF)</text>
    </g>

    <!-- CUS 2.4 : Filtrer par période et service (Extension) -->
    <g transform="translate(450, 640)" filter="url(#drop-shadow-s2)">
        <ellipse cx="0" cy="0" rx="145" ry="30" fill="#ffffff" stroke="#000000" stroke-width="2"/>
        <text x="0" y="-3" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Filtrer par période</text>
        <text x="0" y="14" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">et catégorie de service</text>
    </g>

    <!-- COLONNE 2 : TRAITEMENT AUTOMATISÉ (CENTRE X = 780) -->

    <!-- CUS 2.5 : Calculer automatiquement les métriques SLA -->
    <g transform="translate(780, 440)" filter="url(#drop-shadow-s2)">
        <ellipse cx="0" cy="0" rx="145" ry="32" fill="#ffffff" stroke="#0020B2" stroke-width="2"/>
        <text x="0" y="-4" fill="#0020B2" font-size="12" font-weight="bold" text-anchor="middle">Calculer automatiquement</text>
        <text x="0" y="14" fill="#0020B2" font-size="12" font-weight="bold" text-anchor="middle">les métriques SLA (Uptime, MTTR)</text>
    </g>


    <!-- LIAISONS ACTEUR -> CAS D'UTILISATION -->
    <line x1="145" y1="435" x2="305" y2="275" stroke="#000000" stroke-width="1.8"/>
    <line x1="145" y1="450" x2="295" y2="440" stroke="#000000" stroke-width="1.8"/>


    <!-- RELATIONS <<include>> ET <<extend>> SANS CADRE -->
    <!-- Consulter SLA -> S'authentifier -->
    <line x1="450" y1="230" x2="450" y2="125" stroke="#0020B2" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-open-s2)"/>
    <text x="460" y="175" fill="#0020B2" font-size="11" font-style="italic" font-weight="bold">&lt;&lt;include&gt;&gt;</text>

    <!-- Générer Rapports -> Calculer Métriques SLA -->
    <line x1="605" y1="440" x2="635" y2="440" stroke="#0020B2" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-open-s2)"/>
    <text x="620" y="430" fill="#0020B2" font-size="11" font-style="italic" font-weight="bold" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

    <!-- Filtrer Période -> Générer Rapports (extend) -->
    <line x1="450" y1="610" x2="450" y2="472" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-extend-s2)"/>
    <text x="460" y="550" fill="#7c3aed" font-size="11" font-style="italic" font-weight="bold">&lt;&lt;extend&gt;&gt;</text>

</svg>
