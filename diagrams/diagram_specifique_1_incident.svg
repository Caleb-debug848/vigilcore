<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 840" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Segoe UI', Calibri, Arial, sans-serif;">
    <defs>
        <!-- Filtres  -->
        <filter id="drop-shadow-s1" x="-10%" y="-10%" width="130%" height="130%">
            <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.10"/>
        </filter>
        <filter id="actor-shadow-s1" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.12"/>
        </filter>

        <!-- Marqueur Flèche UML include -->
        <marker id="arrow-open-s1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
            <path d="M 0 1.5 L 9 5 L 0 8.5" fill="none" stroke="#0020B2" stroke-width="1.6" stroke-linecap="round"/>
        </marker>
    </defs>

    <!-- ======================================================== -->
    <!-- CADRE DU SOUS-SYSTÈME (POWERAMC BOUNDARY)                 -->
    <!-- ======================================================== -->
    <rect x="250" y="35" width="720" height="770" rx="10" ry="10" fill="#f8fafc" stroke="#0020B2" stroke-width="2.5" filter="url(#drop-shadow-s1)"/>
    
    <path d="M 620 35 L 970 35 L 970 73 L 605 73 Z" fill="#0020B2"/>
    <text x="787" y="60" fill="#ffffff" font-size="13.5" font-weight="bold" text-anchor="middle" letter-spacing="0.5">
        Sous-Système : Détection &amp; Gestion des Incidents
    </text>

    <!-- ======================================================== -->
    <!-- ACTEURS HUMAINS ET SYSTÈMES EXTERNES                     -->
    <!-- ======================================================== -->

    <!-- Acteur Humain : Opérateur de Supervision (Gauche, Y=450) -->
    <g transform="translate(60, 390)" filter="url(#actor-shadow-s1)">
        <circle cx="40" cy="18" r="16" fill="#ffffff" stroke="#000000" stroke-width="2"/>
        <line x1="40" y1="34" x2="40" y2="74" stroke="#000000" stroke-width="2"/>
        <line x1="12" y1="50" x2="68" y2="50" stroke="#000000" stroke-width="2"/>
        <line x1="40" y1="74" x2="16" y2="108" stroke="#000000" stroke-width="2"/>
        <line x1="40" y1="74" x2="64" y2="108" stroke="#000000" stroke-width="2"/>
        <text x="40" y="128" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Opérateur de Supervision</text>
        <text x="40" y="144" fill="#475569" font-size="10.5" text-anchor="middle">(Traitement &amp; Diagnostic)</text>
    </g>

    <!-- Acteur Système Tiers 1 : Passerelles Partenaires (Droite, Y=190) -->
    <g transform="translate(1000, 160)" filter="url(#drop-shadow-s1)">
        <rect x="0" y="0" width="240" height="60" rx="8" fill="#ffffff" stroke="#0020B2" stroke-width="2"/>
        <text x="120" y="22" fill="#475569" font-size="10.5" text-anchor="middle">&lt;&lt;Système Tiers Externe&gt;&gt;</text>
        <text x="120" y="42" fill="#0f172a" font-size="12.5" font-weight="bold" text-anchor="middle">Passerelles Partenaires</text>
        <text x="120" y="55" fill="#64748b" font-size="9.5" text-anchor="middle">(Orange, MTN, ENEO...)</text>
    </g>

    <!-- Acteur Système Tiers 2 : Passerelle WhatsApp (Evolution API) (Droite, Y=390) -->
    <g transform="translate(1000, 360)" filter="url(#drop-shadow-s1)">
        <rect x="0" y="0" width="240" height="60" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
        <text x="120" y="22" fill="#475569" font-size="10.5" text-anchor="middle">&lt;&lt;Système Tiers Externe&gt;&gt;</text>
        <text x="120" y="42" fill="#16a34a" font-size="12.5" font-weight="bold" text-anchor="middle">Passerelle WhatsApp</text>
        <text x="120" y="55" fill="#475569" font-size="10" font-weight="bold" text-anchor="middle">(Evolution API / Docker)</text>
    </g>


    <!-- ======================================================== -->
    <!-- CAS D'UTILISATION (DEUX COLONNES NETTES ET PARALLÈLES)   -->
    <!-- ======================================================== -->

    <!-- COLONNE 1 (GAUCHE INTERNE, CENTRE X = 440) -->

    <!-- CUS 1.1 : S'authentifier -->
    <g transform="translate(440, 100)" filter="url(#drop-shadow-s1)">
        <ellipse cx="0" cy="0" rx="95" ry="25" fill="#ffffff" stroke="#000000" stroke-width="2"/>
        <text x="0" y="5" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">S'authentifier</text>
    </g>

    <!-- CUS 1.2 : Suivre la prise en charge -->
    <g transform="translate(440, 260)" filter="url(#drop-shadow-s1)">
        <ellipse cx="0" cy="0" rx="145" ry="30" fill="#ffffff" stroke="#000000" stroke-width="2"/>
        <text x="0" y="-3" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Consulter le diagnostic</text>
        <text x="0" y="14" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">et la qualification</text>
    </g>

    <!-- CUS 1.3 : Inspecter boîte noire JSON -->
    <g transform="translate(440, 450)" filter="url(#drop-shadow-s1)">
        <ellipse cx="0" cy="0" rx="145" ry="30" fill="#ffffff" stroke="#000000" stroke-width="2"/>
        <text x="0" y="-3" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Inspecter les données</text>
        <text x="0" y="14" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">de la boîte noire JSON</text>
    </g>

    <!-- CUS 1.4 : Suivre la résolution -->
    <g transform="translate(440, 640)" filter="url(#drop-shadow-s1)">
        <ellipse cx="0" cy="0" rx="145" ry="30" fill="#ffffff" stroke="#000000" stroke-width="2"/>
        <text x="0" y="-3" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">Suivre la résolution</text>
        <text x="0" y="14" fill="#000000" font-size="12" font-weight="bold" text-anchor="middle">et le rétablissement</text>
    </g>


    <!-- COLONNE 2 (DROITE INTERNE, CENTRE X = 780) -->

    <!-- CUS 1.5 : Détecter anomalie par sondes -->
    <g transform="translate(780, 190)" filter="url(#drop-shadow-s1)">
        <ellipse cx="0" cy="0" rx="145" ry="32" fill="#ffffff" stroke="#0020B2" stroke-width="2"/>
        <text x="0" y="-4" fill="#0020B2" font-size="12" font-weight="bold" text-anchor="middle">Détecter l'anomalie</text>
        <text x="0" y="14" fill="#0020B2" font-size="12" font-weight="bold" text-anchor="middle">via les sondes 30s</text>
    </g>

    <!-- CUS 1.6 : Diffuser alerte WhatsApp -->
    <g transform="translate(780, 390)" filter="url(#drop-shadow-s1)">
        <ellipse cx="0" cy="0" rx="145" ry="30" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
        <text x="0" y="-3" fill="#16a34a" font-size="12" font-weight="bold" text-anchor="middle">Diffuser l'alerte</text>
        <text x="0" y="14" fill="#16a34a" font-size="12" font-weight="bold" text-anchor="middle">WhatsApp en temps réel</text>
    </g>

    <!-- CUS 1.7 : Calculer automatiquement MTTR & Durée -->
    <g transform="translate(780, 640)" filter="url(#drop-shadow-s1)">
        <ellipse cx="0" cy="0" rx="145" ry="32" fill="#ffffff" stroke="#0020B2" stroke-width="2"/>
        <text x="0" y="-4" fill="#0020B2" font-size="12" font-weight="bold" text-anchor="middle">Calculer automatiquement</text>
        <text x="0" y="14" fill="#0020B2" font-size="12" font-weight="bold" text-anchor="middle">la durée et le MTTR</text>
    </g>


    <!-- ======================================================== -->
    <!-- LIAISONS D'ASSOCIATION ACTEURS                           -->
    <!-- ======================================================== -->

    <!-- Opérateur -> Acquitter -->
    <line x1="145" y1="440" x2="295" y2="270" stroke="#000000" stroke-width="1.8"/>

    <!-- Opérateur -> Inspecter Boîte Noire -->
    <line x1="145" y1="455" x2="295" y2="450" stroke="#000000" stroke-width="1.8"/>

    <!-- Opérateur -> Valider Résolution -->
    <line x1="145" y1="470" x2="295" y2="630" stroke="#000000" stroke-width="1.8"/>

    <!-- Passerelles Partenaires <-> Détecter Anomalie -->
    <line x1="1000" y1="190" x2="925" y2="190" stroke="#000000" stroke-width="1.8"/>

    <!-- WhatsApp Cloud <-> Diffuser Alerte -->
    <line x1="1000" y1="390" x2="925" y2="390" stroke="#000000" stroke-width="1.8"/>


    <!-- ======================================================== -->
    <!-- RELATIONS <<include>> SANS CADRE ET SANS CHEVAUCHEMENT   -->
    <!-- ======================================================== -->

    <!-- Acquitter -> S'authentifier -->
    <line x1="440" y1="230" x2="440" y2="125" stroke="#0020B2" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-open-s1)"/>
    <text x="450" y="175" fill="#0020B2" font-size="11" font-style="italic" font-weight="bold">&lt;&lt;include&gt;&gt;</text>

    <!-- Détecter Anomalie -> Diffuser Alerte -->
    <line x1="780" y1="222" x2="780" y2="360" stroke="#0020B2" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-open-s1)"/>
    <text x="790" y="295" fill="#0020B2" font-size="11" font-style="italic" font-weight="bold">&lt;&lt;include&gt;&gt;</text>

    <!-- Valider Résolution -> Calculer MTTR -->
    <line x1="585" y1="640" x2="635" y2="640" stroke="#0020B2" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-open-s1)"/>
    <text x="610" y="630" fill="#0020B2" font-size="11" font-style="italic" font-weight="bold" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

</svg>
