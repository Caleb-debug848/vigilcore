<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 900" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Segoe UI', Calibri, Arial, sans-serif;">
    <defs>
        <filter id="shadow-seq2" x="-10%" y="-10%" width="130%" height="130%">
            <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.12"/>
        </filter>
        <filter id="actor-shadow-seq2" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15"/>
        </filter>
        <marker id="arrow-sync-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
            <polygon points="0 1, 9 5, 0 9" fill="#000000"/>
        </marker>
        <marker id="arrow-reply-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
            <path d="M 9 1 L 0 5 L 9 9" fill="none" stroke="#0020B2" stroke-width="1.8" stroke-linecap="round"/>
        </marker>
    </defs>

    <!-- CADRE GÉNÉRAL DU DIAGRAMME DE SÉQUENCE -->
    <rect x="20" y="20" width="1280" height="850" rx="10" ry="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow-seq2)"/>
    
    <!-- BADGE D'EN-TÊTE UML -->
    <path d="M 20 20 L 590 20 L 615 48 L 590 48 L 20 48 Z" fill="#0020B2"/>
    <text x="35" y="37" fill="#ffffff" font-size="15" font-weight="bold" letter-spacing="0.5">
        sd : Supervision Directe &amp; Téléchargement Audit de Disponibilité
    </text>

    <!-- ======================================================== -->
    <!-- ACTEURS ET OBJETS PARTICIPANTS (LIGNES DE VIE)           -->
    <!-- ======================================================== -->

    <!-- 1. Acteur Humain Unique : Utilisateur Interne (X = 90) -->
    <g transform="translate(50, 50)">
        <circle cx="40" cy="15" r="14" fill="#ffffff" stroke="#000000" stroke-width="2.2" filter="url(#actor-shadow-seq2)"/>
        <line x1="40" y1="29" x2="40" y2="56" stroke="#000000" stroke-width="2.2"/>
        <line x1="16" y1="40" x2="64" y2="40" stroke="#000000" stroke-width="2.2"/>
        <line x1="40" y1="56" x2="20" y2="80" stroke="#000000" stroke-width="2.2"/>
        <line x1="40" y1="56" x2="60" y2="80" stroke="#000000" stroke-width="2.2"/>
        <text x="40" y="98" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">Utilisateur Interne</text>
        <text x="40" y="113" fill="#334155" font-size="11" font-weight="bold" text-anchor="middle">(Support / SLA / Direction)</text>
    </g>
    <line x1="90" y1="170" x2="90" y2="830" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 6"/>

    <!-- 2. Interface Web : X = 320 -->
    <g transform="translate(235, 75)">
        <rect x="0" y="0" width="170" height="44" rx="8" fill="#3b82f6" stroke="#0020B2" stroke-width="1.8" filter="url(#shadow-seq2)"/>
        <text x="85" y="27" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">:InterfaceWeb</text>
    </g>
    <line x1="320" y1="120" x2="320" y2="830" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 6"/>

    <!-- 3. Contrôleur de Supervision : X = 560 -->
    <g transform="translate(475, 75)">
        <rect x="0" y="0" width="170" height="44" rx="8" fill="#3b82f6" stroke="#0020B2" stroke-width="1.8" filter="url(#shadow-seq2)"/>
        <text x="85" y="27" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">:ControleurSupervision</text>
    </g>
    <line x1="560" y1="120" x2="560" y2="830" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 6"/>

    <!-- 4. Modèle BDD (Incident) : X = 780 -->
    <g transform="translate(700, 75)">
        <rect x="0" y="0" width="160" height="44" rx="8" fill="#3b82f6" stroke="#0020B2" stroke-width="1.8" filter="url(#shadow-seq2)"/>
        <text x="80" y="27" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">:Incident (Base BDD)</text>
    </g>
    <line x1="780" y1="120" x2="780" y2="830" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 6"/>

    <!-- 5. Contrôleur d'Export : X = 990 -->
    <g transform="translate(905, 75)">
        <rect x="0" y="0" width="170" height="44" rx="8" fill="#3b82f6" stroke="#0020B2" stroke-width="1.8" filter="url(#shadow-seq2)"/>
        <text x="85" y="27" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">:ControleurExportAudit</text>
    </g>
    <line x1="990" y1="120" x2="990" y2="830" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 6"/>


    <!-- ======================================================== -->
    <!-- BARRES D'ACTIVATION                                      -->
    <!-- ======================================================== -->
    <rect x="83" y="170" width="14" height="650" rx="3" fill="#cbd5e1" stroke="#475569" stroke-width="1.4"/>
    <rect x="313" y="175" width="14" height="635" rx="3" fill="#cbd5e1" stroke="#475569" stroke-width="1.4"/>
    <rect x="553" y="190" width="14" height="230" rx="3" fill="#cbd5e1" stroke="#475569" stroke-width="1.4"/>
    <rect x="553" y="470" width="14" height="130" rx="3" fill="#cbd5e1" stroke="#475569" stroke-width="1.4"/>
    <rect x="773" y="220" width="14" height="80" rx="3" fill="#cbd5e1" stroke="#475569" stroke-width="1.4"/>
    <rect x="773" y="500" width="14" height="70" rx="3" fill="#cbd5e1" stroke="#475569" stroke-width="1.4"/>
    <rect x="773" y="680" width="14" height="70" rx="3" fill="#cbd5e1" stroke="#475569" stroke-width="1.4"/>
    <rect x="983" y="650" width="14" height="140" rx="3" fill="#cbd5e1" stroke="#475569" stroke-width="1.4"/>


    <!-- ======================================================== -->
    <!-- CHRONOLOGIE 1 : AUTHENTIFICATION & AFFICHAGE DIRECT      -->
    <!-- ======================================================== -->
    
    <!-- 1. Utilisateur se connecte -->
    <line x1="97" y1="180" x2="313" y2="180" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-sync-2)"/>
    <text x="110" y="174" fill="#000000" font-size="12" font-weight="bold">1: saisirIdentifiants(email, motDePasse)</text>

    <!-- 2. Interface appelle Dashboard -->
    <line x1="327" y1="210" x2="553" y2="210" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-sync-2)"/>
    <text x="345" y="204" fill="#000000" font-size="12" font-weight="bold">2: chargerMatriceDesServices()</text>

    <!-- 3. Requête BDD état des services -->
    <line x1="567" y1="240" x2="773" y2="240" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-sync-2)"/>
    <text x="580" y="234" fill="#000000" font-size="11.5" font-weight="bold">3: getPannesActivesEtSanteServices()</text>

    <!-- 4. Réponse BDD -->
    <line x1="773" y1="280" x2="567" y2="280" stroke="#0020B2" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow-reply-2)"/>
    <text x="595" y="274" fill="#0020B2" font-size="11.5" font-style="italic" font-weight="bold">4: Statut des 20 services (Vert / Rouge)</text>

    <!-- 5. Rendu Matrice à l'écran -->
    <line x1="313" y1="315" x2="97" y2="315" stroke="#0020B2" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow-reply-2)"/>
    <text x="115" y="309" fill="#0020B2" font-size="11.5" font-style="italic" font-weight="bold">5: Affichage console de supervision en direct</text>


    <!-- ======================================================== -->
    <!-- CHRONOLOGIE 2 : INSPECTION DIAGNOSTIC BOÎTE NOIRE        -->
    <!-- ======================================================== -->
    <rect x="70" y="355" width="760" height="150" rx="6" fill="#f8fafc" fill-opacity="0.6" stroke="#0020B2" stroke-width="1.5"/>
    <path d="M 70 355 L 245 355 L 260 375 L 70 375 Z" fill="#0020B2"/>
    <text x="80" y="370" fill="#ffffff" font-size="12" font-weight="bold">Inspection Boîte Noire</text>

    <!-- 6. Utilisateur clique sur Inspecter -->
    <line x1="97" y1="395" x2="313" y2="395" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-sync-2)"/>
    <text x="110" y="389" fill="#000000" font-size="12" font-weight="bold">6: inspecterIncident(#INC-8492)</text>

    <!-- 7. Interface demande les détails -->
    <line x1="327" y1="420" x2="553" y2="420" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-sync-2)"/>
    <text x="345" y="414" fill="#000000" font-size="11.5" font-weight="bold">7: ouvrirFenetreDiagnostic(id)</text>

    <!-- 8. Récupération des données brutes -->
    <line x1="567" y1="450" x2="773" y2="450" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-sync-2)"/>
    <text x="580" y="444" fill="#000000" font-size="11.5" font-weight="bold">8: recupererDonneesBrutes(id)</text>

    <!-- 9. BDD renvoie les métadonnées complètes -->
    <line x1="773" y1="480" x2="327" y2="480" stroke="#0020B2" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow-reply-2)"/>
    <text x="370" y="474" fill="#0020B2" font-size="11.5" font-style="italic" font-weight="bold">9: Donnees JSON, Code 504, Cause racine, Heure WAT</text>


    <!-- ======================================================== -->
    <!-- CHRONOLOGIE 3 : EXPORT REGISTRE D'AUDIT EXCEL (12 COLONNES) -->
    <!-- ======================================================== -->
    
    <!-- 10. Utilisateur choisit la période et clique sur Télécharger -->
    <line x1="97" y1="580" x2="313" y2="580" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-sync-2)"/>
    <text x="110" y="574" fill="#000000" font-size="12" font-weight="bold">10: filtrerPeriode("aujourd_hui") &amp; cliquerExportExcel()</text>

    <!-- 11. Redirection vers la route d'export -->
    <line x1="327" y1="620" x2="983" y2="620" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-sync-2)"/>
    <text x="380" y="614" fill="#000000" font-size="12" font-weight="bold">11: demanderExportExcel(format="xlsx", periode="aujourd_hui")</text>

    <!-- 12. Requête d'audit complète -->
    <line x1="983" y1="660" x2="787" y2="660" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-sync-2)"/>
    <text x="805" y="654" fill="#000000" font-size="11.5" font-weight="bold">12: extraireLignesCertifieesPourAudit()</text>

    <!-- 13. Données des 12 colonnes renvoyées -->
    <line x1="787" y1="700" x2="983" y2="700" stroke="#0020B2" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow-reply-2)"/>
    <text x="800" y="694" fill="#0020B2" font-size="11.5" font-style="italic" font-weight="bold">13: Lignes (Debut WAT, Fin WAT, Duree, Codes, Causes)</text>

    <!-- 14. Génération du classeur Excel -->
    <path d="M 997 725 L 1035 725 L 1035 745 L 997 745" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-sync-2)"/>
    <text x="1045" y="738" fill="#000000" font-size="11.5" font-weight="bold">14: genererClasseurExcel12Colonnes()</text>

    <!-- 15. Téléchargement direct du fichier certifié -->
    <line x1="983" y1="785" x2="97" y2="785" stroke="#0020B2" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow-reply-2)"/>
    <text x="250" y="779" fill="#0020B2" font-size="12" font-weight="bold">15: Telechargement: registre_incidents_audit_12col.xlsx (Certifié)</text>

</svg>
