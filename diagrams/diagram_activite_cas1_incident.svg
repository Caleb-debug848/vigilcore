<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Segoe UI', Calibri, Arial, sans-serif;">
    <defs>
        <!-- Filtre ombre douce  -->
        <filter id="shadow-act1" x="-10%" y="-10%" width="130%" height="130%">
            <feDropShadow dx="2" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.12"/>
        </filter>

        <!-- Marqueur Flèche de Flux d'Activité  -->
        <marker id="arrow-act1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
            <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#000000"/>
        </marker>
    </defs>

    <!-- CADRE GÉNÉRAL DU DIAGRAMME D'ACTIVITÉ POWERAMC -->
    <rect x="20" y="20" width="1160" height="920" rx="8" ry="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow-act1)"/>
    
    <!-- BANDEAU DE TITRE UML POWERAMC -->
    <path d="M 20 20 L 630 20 L 655 48 L 630 48 L 20 48 Z" fill="#0020B2"/>
    <text x="35" y="37" fill="#ffffff" font-size="15" font-weight="bold" letter-spacing="0.5">
        act : Activité — Détection, Diagnostic &amp; Diffusion d'Alertes
    </text>

    <!-- ========================================================================= -->
    <!-- COULOIRS (SWIMLANES / PARTITIONS)                                         -->
    <!-- ========================================================================= -->
    <!-- Couloir 1 : Passerelles & Sondes Externes -->
    <rect x="30" y="55" width="275" height="35" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="167" y="78" fill="#0020B2" font-size="13.5" font-weight="bold" text-anchor="middle">Sondes &amp; Passerelles Partenaires</text>
    <line x1="30" y1="90" x2="30" y2="925" stroke="#cbd5e1" stroke-width="1.2"/>

    <!-- Couloir 2 : Moteur VigilCore (Backend & Boîte Noire) -->
    <rect x="305" y="55" width="320" height="35" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="465" y="78" fill="#0020B2" font-size="13.5" font-weight="bold" text-anchor="middle">Moteur VigilCore (Backend &amp; Diagnostic)</text>
    <line x1="305" y1="55" x2="305" y2="925" stroke="#cbd5e1" stroke-width="1.2"/>

    <!-- Couloir 3 : n8n & Diffusion Alertes -->
    <rect x="625" y="55" width="290" height="35" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="770" y="78" fill="#0020B2" font-size="13.5" font-weight="bold" text-anchor="middle">Orchestration n8n &amp; Diffusion Alertes</text>
    <line x1="625" y1="55" x2="625" y2="925" stroke="#cbd5e1" stroke-width="1.2"/>

    <!-- Couloir 4 : Utilisateur (Équipe Technique) -->
    <rect x="915" y="55" width="255" height="35" fill="#f0fdf4" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="1042" y="78" fill="#16a34a" font-size="13.5" font-weight="bold" text-anchor="middle">Utilisateur (Équipe Technique)</text>
    <line x1="915" y1="55" x2="915" y2="925" stroke="#cbd5e1" stroke-width="1.2"/>
    <line x1="1170" y1="55" x2="1170" y2="925" stroke="#cbd5e1" stroke-width="1.2"/>


    <!-- ========================================================================= -->
    <!-- FLOT D'ACTIVITÉ POWERAMC                                                  -->
    <!-- ========================================================================= -->

    <!-- NŒUD INITIAL (Couloir 1) -->
    <circle cx="167" cy="115" r="14" fill="#000000"/>
    <line x1="167" y1="129" x2="167" y2="158" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-act1)"/>

    <!-- Activité 1 (Couloir 1) : Exécuter Sonde HTTP 30s -->
    <g transform="translate(55, 160)" filter="url(#shadow-act1)">
        <rect x="0" y="0" width="225" height="48" rx="20" fill="#f8fafc" stroke="#0020B2" stroke-width="1.8"/>
        <text x="112" y="30" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">Exécuter Sonde HTTP 30s</text>
    </g>

    <line x1="167" y1="208" x2="167" y2="243" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-act1)"/>

    <!-- Décision 1 (Couloir 1) : Anomalie détectée ? -->
    <g transform="translate(142, 245)">
        <polygon points="25 0, 50 20, 25 40, 0 20" fill="#ffffff" stroke="#0020B2" stroke-width="1.8"/>
    </g>

    <!-- Branche Nominale : 200 OK -> Fin de flot -->
    <line x1="192" y1="265" x2="248" y2="265" stroke="#000000" stroke-width="1.8"/>
    <text x="215" y="258" fill="#16a34a" font-size="11.5" font-weight="bold">[200 OK]</text>
    <circle cx="262" cy="265" r="10" fill="none" stroke="#64748b" stroke-width="1.8"/>
    <line x1="255" y1="258" x2="269" y2="272" stroke="#64748b" stroke-width="1.8"/>
    <line x1="255" y1="272" x2="269" y2="258" stroke="#64748b" stroke-width="1.8"/>

    <!-- Branche Anomalie -> Transition propre vers Couloir 2 -->
    <path d="M 167 285 L 167 330 L 343 330" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-act1)"/>
    <text x="175" y="315" fill="#dc2626" font-size="11.5" font-weight="bold">[Erreur 500 / Timeout]</text>

    <!-- Activité 2 (Couloir 2) : Créer Dossier Incident -->
    <g transform="translate(345, 305)" filter="url(#shadow-act1)">
        <rect x="0" y="0" width="240" height="52" rx="22" fill="#eff6ff" stroke="#0020B2" stroke-width="1.8"/>
        <text x="120" y="23" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">Créer Dossier Incident</text>
        <text x="120" y="41" fill="#334155" font-size="11" font-weight="bold" text-anchor="middle">Horodatage WAT &amp; Statut En Analyse</text>
    </g>

    <line x1="465" y1="357" x2="465" y2="393" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-act1)"/>

    <!-- Activité 3 (Couloir 2) : Capturer Boîte Noire Diagnostic -->
    <g transform="translate(345, 395)" filter="url(#shadow-act1)">
        <rect x="0" y="0" width="240" height="52" rx="22" fill="#eff6ff" stroke="#0020B2" stroke-width="1.8"/>
        <text x="120" y="23" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">Capturer Boîte Noire</text>
        <text x="120" y="41" fill="#334155" font-size="11" font-weight="bold" text-anchor="middle">Données JSON brutes &amp; En-têtes</text>
    </g>

    <line x1="465" y1="447" x2="465" y2="483" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-act1)"/>

    <!-- BARRE DE SYNCHRONISATION (FORK - PARALLÉLISME) -->
    <rect x="360" y="485" width="210" height="6" fill="#000000" rx="2"/>

    <!-- Branche Parallèle 1 : Mise à Jour Page d'État Web (Couloir 3) -->
    <path d="M 400 491 L 400 520 L 648 520" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-act1)"/>
    <g transform="translate(650, 495)" filter="url(#shadow-act1)">
        <rect x="0" y="0" width="240" height="50" rx="20" fill="#f8fafc" stroke="#0020B2" stroke-width="1.8"/>
        <text x="120" y="23" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">Actualiser Page d'État</text>
        <text x="120" y="41" fill="#334155" font-size="11" font-weight="bold" text-anchor="middle">Publication Statut Dégradé / Panne</text>
    </g>

    <!-- Branche Parallèle 2 : Notification WhatsApp (Couloir 3) -->
    <path d="M 530 491 L 530 580 L 648 580" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-act1)"/>
    <g transform="translate(650, 555)" filter="url(#shadow-act1)">
        <rect x="0" y="0" width="240" height="50" rx="20" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
        <text x="120" y="23" fill="#16a34a" font-size="13" font-weight="bold" text-anchor="middle">Diffuser Alerte WhatsApp</text>
        <text x="120" y="41" fill="#334155" font-size="11" font-weight="bold" text-anchor="middle">Template HSM d'urgence</text>
    </g>

    <!-- BARRE DE JOINTURE (JOIN) -->
    <line x1="890" y1="520" x2="930" y2="520" stroke="#000000" stroke-width="1.8"/>
    <line x1="890" y1="580" x2="930" y2="580" stroke="#000000" stroke-width="1.8"/>
    <rect x="930" y="495" width="6" height="110" fill="#000000" rx="2"/>

    <!-- Vers Couloir 4 : Intervention Technique -->
    <line x1="936" y1="550" x2="968" y2="550" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-act1)"/>

    <!-- Activité 4 (Couloir 4) : Acquitter et Diagnostiquer -->
    <g transform="translate(970, 525)" filter="url(#shadow-act1)">
        <rect x="0" y="0" width="185" height="52" rx="22" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
        <text x="92" y="23" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">Acquitter &amp; Diagnostiquer</text>
        <text x="92" y="41" fill="#334155" font-size="11" font-weight="bold" text-anchor="middle">Analyse Cause Racine</text>
    </g>

    <line x1="1062" y1="577" x2="1062" y2="613" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-act1)"/>

    <!-- Activité 5 (Couloir 4) : Valider la Résolution -->
    <g transform="translate(970, 615)" filter="url(#shadow-act1)">
        <rect x="0" y="0" width="185" height="52" rx="22" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
        <text x="92" y="23" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">Valider la Résolution</text>
        <text x="92" y="41" fill="#334155" font-size="11" font-weight="bold" text-anchor="middle">Saisir note de clôture</text>
    </g>

    <!-- Vers Couloir 2 : Calcul Automatique MTTR & Clôture -->
    <path d="M 970 641 L 603 641" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-act1)"/>

    <!-- Activité 6 (Couloir 2) : Calcul Automatique en Tâche de Fond -->
    <g transform="translate(345, 615)" filter="url(#shadow-act1)">
        <rect x="0" y="0" width="255" height="56" rx="22" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
        <text x="127" y="24" fill="#7c3aed" font-size="13" font-weight="bold" text-anchor="middle">Calcul Automatique en Tâche de Fond</text>
        <text x="127" y="44" fill="#334155" font-size="11" font-weight="bold" text-anchor="middle">Durée de coupure, MTTR &amp; Consolidation SLA</text>
    </g>

    <line x1="472" y1="671" x2="472" y2="723" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-act1)"/>

    <!-- Activité 7 (Couloir 2) : Archiver et Publier Retour Nominal -->
    <g transform="translate(345, 725)" filter="url(#shadow-act1)">
        <rect x="0" y="0" width="255" height="52" rx="22" fill="#eff6ff" stroke="#0020B2" stroke-width="1.8"/>
        <text x="127" y="23" fill="#000000" font-size="13" font-weight="bold" text-anchor="middle">Archiver &amp; Publier Retour Nominal</text>
        <text x="127" y="41" fill="#334155" font-size="11" font-weight="bold" text-anchor="middle">Actualisation Page Web &amp; Clôture</text>
    </g>

    <line x1="472" y1="777" x2="472" y2="833" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-act1)"/>

    <!-- NŒUD FINAL (Couloir 2) -->
    <circle cx="472" cy="845" r="14" fill="none" stroke="#000000" stroke-width="2.2"/>
    <circle cx="472" cy="845" r="8" fill="#000000"/>

</svg>
