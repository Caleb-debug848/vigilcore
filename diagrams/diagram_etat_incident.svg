<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Segoe UI', Calibri, Arial, sans-serif;">
    <defs>
        <!-- Filtre ombre douce  -->
        <filter id="shadow-state" x="-10%" y="-10%" width="130%" height="130%">
            <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.12"/>
        </filter>

        <!-- Marqueur Flèche de Transition Normée UML -->
        <marker id="arrow-tr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#000000"/>
        </marker>
        <marker id="arrow-tr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#dc2626"/>
        </marker>
    </defs>

    <!-- CADRE GÉNÉRAL DU DIAGRAMME D'ÉTATS-TRANSITIONS -->
    <rect x="20" y="20" width="1160" height="660" rx="10" ry="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow-state)"/>
    
    <!-- BANDEAU DE TITRE UML -->
    <path d="M 20 20 L 580 20 L 605 48 L 580 48 L 20 48 Z" fill="#0020B2"/>
    <text x="35" y="37" fill="#ffffff" font-size="15" font-weight="bold" letter-spacing="0.5">
        stm : Cycle de Vie d'un Incident dans VigilCore
    </text>

    <!-- ========================================================================= -->
    <!-- 1. ÉTAT INITIAL (Disque noir plein)                                       -->
    <!-- Position: cx=55, cy=170, r=14                                             -->
    <!-- ========================================================================= -->
    <circle cx="55" cy="170" r="14" fill="#000000"/>

    <!-- Transition Initiale vers État 1 (TRAIT PLEIN) -->
    <line x1="69" y1="170" x2="138" y2="170" stroke="#000000" stroke-width="2" marker-end="url(#arrow-tr)"/>
    <text x="50" y="138" fill="#0020B2" font-size="11.5" font-weight="bold">anomalieDetectee</text>
    <text x="50" y="155" fill="#334155" font-size="10" font-weight="bold">[HTTP 500 / 504]</text>


    <!-- ========================================================================= -->
    <!-- 2. ÉTAT 1 : En cours d'analyse & Diagnostic (Vert)                        -->
    <!-- Position: X=140, Y=110 | L=230, H=125                                     -->
    <!-- ========================================================================= -->
    <g transform="translate(140, 110)" filter="url(#shadow-state)">
        <rect x="0" y="0" width="230" height="125" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
        <rect x="0" y="0" width="230" height="30" rx="12" fill="#16a34a"/>
        <rect x="0" y="18" width="230" height="12" fill="#16a34a"/>
        <text x="115" y="21" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">En cours d'analyse</text>
        
        <text x="10" y="52" fill="#000000" font-size="11.5" font-weight="bold">entree / horodaterDebut()</text>
        <text x="10" y="72" fill="#000000" font-size="11.5" font-weight="bold">faire / capturerBoiteNoireJSON()</text>
        <text x="10" y="92" fill="#000000" font-size="11.5" font-weight="bold">faire / actualiserPageWeb('en_cours')</text>
        <text x="10" y="112" fill="#000000" font-size="11.5" font-weight="bold">sortie / figerDiagnosticInitial()</text>
    </g>


    <!-- Transition État 1 -> État 2 (TRAIT PLEIN - ESPACE DÉGAGÉ DE 120PX) -->
    <line x1="370" y1="170" x2="488" y2="170" stroke="#000000" stroke-width="2" marker-end="url(#arrow-tr)"/>
    <text x="430" y="142" fill="#0020B2" font-size="12" font-weight="bold" text-anchor="middle">causeIdentifiee</text>
    <text x="430" y="160" fill="#334155" font-size="10.5" font-weight="bold" text-anchor="middle">[diagnostic_valide]</text>

    <!-- Transition d'Annulation Fausse Alerte État 1 -> État 5 (TRAIT PLEIN) -->
    <path d="M 255 235 L 255 398" fill="none" stroke="#000000" stroke-width="2" marker-end="url(#arrow-tr)"/>
    <text x="265" y="300" fill="#0020B2" font-size="11.5" font-weight="bold">annulationFausseAlerte</text>
    <text x="265" y="318" fill="#334155" font-size="10" font-weight="bold">[sonde_reussie_immediatement]</text>
    <text x="265" y="334" fill="#334155" font-size="10" font-weight="bold">/ marquerFausseAlerte()</text>


    <!-- ========================================================================= -->
    <!-- 3. ÉTAT 2 : Cause Racine Identifiée (Bleu)                                -->
    <!-- Position: X=490, Y=110 | L=230, H=125                                     -->
    <!-- ========================================================================= -->
    <g transform="translate(490, 110)" filter="url(#shadow-state)">
        <rect x="0" y="0" width="230" height="125" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
        <rect x="0" y="0" width="230" height="30" rx="12" fill="#2563eb"/>
        <rect x="0" y="18" width="230" height="12" fill="#2563eb"/>
        <text x="115" y="21" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Cause Racine Identifiée</text>
        
        <text x="10" y="52" fill="#000000" font-size="11.5" font-weight="bold">entree / envoyerAlerteWhatsApp()</text>
        <text x="10" y="72" fill="#000000" font-size="11.5" font-weight="bold">faire / notifierEquipeTechnique()</text>
        <text x="10" y="92" fill="#000000" font-size="11.5" font-weight="bold">faire / actualiserPageWeb('identifie')</text>
        <text x="10" y="112" fill="#000000" font-size="11.5" font-weight="bold">sortie / noterHeurePriseEnCharge()</text>
    </g>


    <!-- Transition État 2 -> État 3 (TRAIT PLEIN - ESPACE DÉGAGÉ DE 120PX SANS CHEVAUCHEMENT) -->
    <line x1="720" y1="170" x2="838" y2="170" stroke="#000000" stroke-width="2" marker-end="url(#arrow-tr)"/>
    <text x="780" y="142" fill="#0020B2" font-size="12" font-weight="bold" text-anchor="middle">actionCorrective</text>
    <text x="780" y="160" fill="#334155" font-size="10.5" font-weight="bold" text-anchor="middle">[bascule_secours]</text>


    <!-- ========================================================================= -->
    <!-- 4. ÉTAT 3 : Surveillance & Tests Post-Correctif (Jaune)                   -->
    <!-- Position: X=840, Y=110 | L=230, H=125                                     -->
    <!-- ========================================================================= -->
    <g transform="translate(840, 110)" filter="url(#shadow-state)">
        <rect x="0" y="0" width="230" height="125" rx="12" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
        <rect x="0" y="0" width="230" height="30" rx="12" fill="#ca8a04"/>
        <rect x="0" y="18" width="230" height="12" fill="#ca8a04"/>
        <text x="115" y="21" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Surveillance &amp; Tests</text>
        
        <text x="10" y="52" fill="#000000" font-size="11.5" font-weight="bold">entree / lancerSondesSante30s()</text>
        <text x="10" y="72" fill="#000000" font-size="11.5" font-weight="bold">faire / testerDisponibilite()</text>
        <text x="10" y="92" fill="#000000" font-size="11.5" font-weight="bold">faire / actualiserPageWeb('surveillance')</text>
        <text x="10" y="112" fill="#000000" font-size="11.5" font-weight="bold">sortie / compilerMetriquesTest()</text>
    </g>


    <!-- Transition de Rechute État 3 -> État 2 (TRAIT PLEIN) -->
    <path d="M 910 235 L 910 290 L 605 290 L 605 237" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-tr-red)"/>
    <text x="757" y="280" fill="#dc2626" font-size="11.5" font-weight="bold" text-anchor="middle">rechuteAnomalie [re-echec_sonde] / reouvrirDiagnostic()</text>


    <!-- Transition de Résolution État 3 -> État 4 (TRAIT PLEIN) -->
    <path d="M 955 235 L 955 398" fill="none" stroke="#000000" stroke-width="2" marker-end="url(#arrow-tr)"/>
    <text x="965" y="300" fill="#16a34a" font-size="12" font-weight="bold">retablissementValide</text>
    <text x="965" y="318" fill="#334155" font-size="10.5" font-weight="bold">[3_succes_consecutifs]</text>
    <text x="965" y="335" fill="#334155" font-size="10.5" font-weight="bold">/ marquerResolu()</text>


    <!-- ========================================================================= -->
    <!-- 5. ÉTAT 4 : Résolu & Clôturé (Violet)                                     -->
    <!-- Position: X=800, Y=400 | L=270, H=135                                     -->
    <!-- ========================================================================= -->
    <g transform="translate(800, 400)" filter="url(#shadow-state)">
        <rect x="0" y="0" width="270" height="135" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
        <rect x="0" y="0" width="270" height="30" rx="12" fill="#7c3aed"/>
        <rect x="0" y="18" width="270" height="12" fill="#7c3aed"/>
        <text x="135" y="21" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Résolu &amp; Clôturé</text>
        
        <text x="10" y="52" fill="#000000" font-size="11.5" font-weight="bold">entree / horodaterFinWAT()</text>
        <text x="10" y="72" fill="#000000" font-size="11.5" font-weight="bold">faire / calculerDureeCoupureSec()</text>
        <text x="10" y="92" fill="#000000" font-size="11.5" font-weight="bold">faire / recalculerSlaDisponibilite()</text>
        <text x="10" y="112" fill="#000000" font-size="11.5" font-weight="bold">faire / publierRetourNominalPageWeb()</text>
        <text x="10" y="130" fill="#000000" font-size="11" font-weight="bold">sortie / archiverPourAuditSLA()</text>
    </g>


    <!-- ========================================================================= -->
    <!-- 6. ÉTAT 5 : Fausse Alerte Annulée (Gris)                                  -->
    <!-- Position: X=140, Y=400 | L=230, H=115                                     -->
    <!-- ========================================================================= -->
    <g transform="translate(140, 400)" filter="url(#shadow-state)">
        <rect x="0" y="0" width="230" height="115" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
        <rect x="0" y="0" width="230" height="30" rx="12" fill="#64748b"/>
        <rect x="0" y="18" width="230" height="12" fill="#64748b"/>
        <text x="115" y="21" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Fausse Alerte Annulée</text>
        
        <text x="10" y="52" fill="#000000" font-size="11.5" font-weight="bold">entree / annulerIncident()</text>
        <text x="10" y="72" fill="#000000" font-size="11.5" font-weight="bold">faire / supprimerDePageWeb()</text>
        <text x="10" y="92" fill="#000000" font-size="11.5" font-weight="bold">sortie / classerSansSuite()</text>
    </g>


    <!-- Transition État 5 -> Nœud Final (TRAIT PLEIN) -->
    <line x1="370" y1="460" x2="578" y2="460" stroke="#000000" stroke-width="2" marker-end="url(#arrow-tr)"/>

    <!-- Transition État 4 -> Nœud Final (TRAIT PLEIN) -->
    <line x1="800" y1="460" x2="622" y2="460" stroke="#000000" stroke-width="2" marker-end="url(#arrow-tr)"/>


    <!-- ========================================================================= -->
    <!-- 7. ÉTAT FINAL (Disque cible avec anneau extérieur)                        -->
    <!-- Position: cx=600, cy=460, r=16                                            -->
    <!-- ========================================================================= -->
    <circle cx="600" cy="460" r="16" fill="none" stroke="#000000" stroke-width="2.2"/>
    <circle cx="600" cy="460" r="10" fill="#000000"/>

</svg>
