<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Segoe UI', Calibri, Arial, sans-serif;">
    <defs>
        <filter id="shadow-seq1" x="-10%" y="-10%" width="130%" height="130%">
            <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.12"/>
        </filter>
        <marker id="arrow-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
            <polygon points="0 1, 9 5, 0 9" fill="#000000"/>
        </marker>
        <marker id="arrow-reply" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
            <path d="M 9 1 L 0 5 L 9 9" fill="none" stroke="#0020B2" stroke-width="1.8" stroke-linecap="round"/>
        </marker>
    </defs>

    <!-- CADRE GÉNÉRAL DU DIAGRAMME DE SÉQUENCE -->
    <rect x="20" y="20" width="1160" height="850" rx="10" ry="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow-seq1)"/>
    
    <!-- BADGE D'EN-TÊTE UML -->
    <path d="M 20 20 L 560 20 L 585 48 L 560 48 L 20 48 Z" fill="#0020B2"/>
    <text x="35" y="37" fill="#ffffff" font-size="15" font-weight="bold" letter-spacing="0.5">
        sd : Détection Automatique, Gestion &amp; Envoi d'Alerte
    </text>

    <!-- ======================================================== -->
    <!-- OBJETS PARTICIPANTS (LIGNES DE VIE)                      -->
    <!-- ======================================================== -->

    <!-- 1. Serveur de Logs : X = 130 -->
    <g transform="translate(50, 65)">
        <rect x="0" y="0" width="160" height="44" rx="8" fill="#3b82f6" stroke="#0020B2" stroke-width="1.8" filter="url(#shadow-seq1)"/>
        <text x="80" y="27" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">:ServeurDeLogs</text>
    </g>
    <line x1="130" y1="110" x2="130" y2="830" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 6"/>

    <!-- 2. Robot d'Alerte (n8n) : X = 320 -->
    <g transform="translate(240, 65)">
        <rect x="0" y="0" width="160" height="44" rx="8" fill="#3b82f6" stroke="#0020B2" stroke-width="1.8" filter="url(#shadow-seq1)"/>
        <text x="80" y="27" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">:RobotAlerte (n8n)</text>
    </g>
    <line x1="320" y1="110" x2="320" y2="830" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 6"/>

    <!-- 3. Contrôleur d'Incidents : X = 510 -->
    <g transform="translate(430, 65)">
        <rect x="0" y="0" width="160" height="44" rx="8" fill="#3b82f6" stroke="#0020B2" stroke-width="1.8" filter="url(#shadow-seq1)"/>
        <text x="80" y="27" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">:ControleurIncidents</text>
    </g>
    <line x1="510" y1="110" x2="510" y2="830" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 6"/>

    <!-- 4. Base de Données (Incident) : X = 700 -->
    <g transform="translate(620, 65)">
        <rect x="0" y="0" width="160" height="44" rx="8" fill="#3b82f6" stroke="#0020B2" stroke-width="1.8" filter="url(#shadow-seq1)"/>
        <text x="80" y="27" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">:Incident (Base BDD)</text>
    </g>
    <line x1="700" y1="110" x2="700" y2="830" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 6"/>

    <!-- 5. Gestionnaire Page Web : X = 870 -->
    <g transform="translate(790, 65)">
        <rect x="0" y="0" width="160" height="44" rx="8" fill="#3b82f6" stroke="#0020B2" stroke-width="1.8" filter="url(#shadow-seq1)"/>
        <text x="80" y="27" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">:PageWebStatus</text>
    </g>
    <line x1="870" y1="110" x2="870" y2="830" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 6"/>

    <!-- 6. Opérateurs / Techniciens : X = 1040 -->
    <g transform="translate(960, 65)">
        <rect x="0" y="0" width="160" height="44" rx="8" fill="#3b82f6" stroke="#0020B2" stroke-width="1.8" filter="url(#shadow-seq1)"/>
        <text x="80" y="27" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">:EquipeTechnique</text>
    </g>
    <line x1="1040" y1="110" x2="1040" y2="830" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 6"/>


    <!-- ======================================================== -->
    <!-- BARRES D'ACTIVATION                                      -->
    <!-- ======================================================== -->
    <rect x="123" y="130" width="14" height="70" rx="3" fill="#cbd5e1" stroke="#475569" stroke-width="1.4"/>
    <rect x="313" y="170" width="14" height="600" rx="3" fill="#cbd5e1" stroke="#475569" stroke-width="1.4"/>
    <rect x="503" y="210" width="14" height="150" rx="3" fill="#cbd5e1" stroke="#475569" stroke-width="1.4"/>
    <rect x="503" y="600" width="14" height="130" rx="3" fill="#cbd5e1" stroke="#475569" stroke-width="1.4"/>
    <rect x="693" y="250" width="14" height="80" rx="3" fill="#cbd5e1" stroke="#475569" stroke-width="1.4"/>
    <rect x="693" y="640" width="14" height="70" rx="3" fill="#cbd5e1" stroke="#475569" stroke-width="1.4"/>
    <rect x="863" y="410" width="14" height="50" rx="3" fill="#cbd5e1" stroke="#475569" stroke-width="1.4"/>
    <rect x="863" y="740" width="14" height="40" rx="3" fill="#cbd5e1" stroke="#475569" stroke-width="1.4"/>
    <rect x="1033" y="490" width="14" height="50" rx="3" fill="#cbd5e1" stroke="#475569" stroke-width="1.4"/>
    <rect x="1033" y="790" width="14" height="40" rx="3" fill="#cbd5e1" stroke="#475569" stroke-width="1.4"/>


    <!-- ======================================================== -->
    <!-- CHRONOLOGIE DES MESSAGES (PHASE 1 : DÉTECTION & ALERTE)  -->
    <!-- ======================================================== -->
    
    <!-- Message 1 : Analyse des logs -->
    <path d="M 137 140 L 175 140 L 175 160 L 137 160" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-sync)"/>
    <text x="185" y="155" fill="#000000" font-size="11.5" font-weight="bold">1: analyserErreursHTTP() [Seuil &gt; 5 / min]</text>

    <!-- Message 2 : Alerte transmise à n8n -->
    <line x1="137" y1="180" x2="313" y2="180" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-sync)"/>
    <text x="145" y="174" fill="#000000" font-size="12" font-weight="bold">2: alertePanneDetectee(service, codeErreur, donnees)</text>

    <!-- Message 3 : n8n déclare l'incident -->
    <line x1="327" y1="220" x2="503" y2="220" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-sync)"/>
    <text x="340" y="214" fill="#000000" font-size="12" font-weight="bold">3: declarerIncident(service, codeErreur, donneesBrutes)</text>

    <!-- Message 4 : Enregistrement de l'incident -->
    <line x1="517" y1="260" x2="693" y2="260" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-sync)"/>
    <text x="530" y="254" fill="#000000" font-size="11.5" font-weight="bold">4: creer(statut="en_analyse", heureDebut, boiteNoire)</text>

    <!-- Message 5 : Confirmation BDD -->
    <line x1="693" y1="310" x2="517" y2="310" stroke="#0020B2" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow-reply)"/>
    <text x="545" y="304" fill="#0020B2" font-size="11.5" font-style="italic" font-weight="bold">5: incident_cree: #INC-8492</text>

    <!-- Message 6 : Confirmation création -->
    <line x1="503" y1="345" x2="327" y2="345" stroke="#0020B2" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow-reply)"/>
    <text x="355" y="339" fill="#0020B2" font-size="11.5" font-style="italic" font-weight="bold">6: retour(id=8492, statut="en_analyse")</text>

    <!-- CADRE COMBINÉ PAR : DIFFUSION MULTI-CANAL -->
    <rect x="300" y="375" width="770" height="195" rx="6" fill="#f8fafc" fill-opacity="0.6" stroke="#0020B2" stroke-width="1.5"/>
    <path d="M 300 375 L 430 375 L 445 395 L 300 395 Z" fill="#0020B2"/>
    <text x="310" y="390" fill="#ffffff" font-size="11.5" font-weight="bold">par (Parallèle)</text>

    <!-- Message 7 : Actualisation Page d'État Web -->
    <line x1="327" y1="415" x2="863" y2="415" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-sync)"/>
    <text x="345" y="409" fill="#000000" font-size="12" font-weight="bold">7: actualiserStatutWeb("panne_majeure", service="Orange MoMo")</text>

    <!-- Message 8 : Statut Web Mis à Jour -->
    <line x1="863" y1="445" x2="327" y2="445" stroke="#0020B2" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow-reply)"/>
    <text x="520" y="439" fill="#0020B2" font-size="11.5" font-style="italic" font-weight="bold">8: reponse(http_200_ok, id_incident_web)</text>

    <!-- Séparateur dans le cadre PAR -->
    <line x1="300" y1="465" x2="1070" y2="465" stroke="#0020B2" stroke-width="1.2" stroke-dasharray="6 4"/>

    <!-- Message 9 : Envoi Alerte WhatsApp -->
    <line x1="327" y1="495" x2="1033" y2="495" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-sync)"/>
    <text x="345" y="489" fill="#16a34a" font-size="12" font-weight="bold">9: envoyerMessageWhatsApp(template="alerte_critique", dest="+237...")</text>

    <!-- Message 10 : Confirmation WhatsApp -->
    <line x1="1033" y1="535" x2="327" y2="535" stroke="#0020B2" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow-reply)"/>
    <text x="590" y="529" fill="#0020B2" font-size="11.5" font-style="italic" font-weight="bold">10: message_livre(wamid="wamid.HBgL...")</text>


    <!-- ======================================================== -->
    <!-- PHASE 2 : RÉSOLUTION ET CALCUL AUTOMATIQUE DU SLA EN BDD -->
    <!-- ======================================================== -->
    
    <!-- Message 11 : Détection retour à la normale -->
    <line x1="327" y1="605" x2="503" y2="605" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-sync)"/>
    <text x="340" y="599" fill="#000000" font-size="12" font-weight="bold">11: notifierResolution(service, heureFinWAT)</text>

    <!-- Message 12 : Résolution + Calcul SLA en tâche de fond -->
    <line x1="517" y1="645" x2="693" y2="645" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-sync)"/>
    <text x="525" y="639" fill="#000000" font-size="11.5" font-weight="bold">12: enregistrerResolutionEtCalculerSlaAsync(id=8492)</text>

    <!-- Message 13 : Confirmation BDD -->
    <line x1="693" y1="690" x2="517" y2="690" stroke="#0020B2" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow-reply)"/>
    <text x="535" y="684" fill="#0020B2" font-size="11.5" font-style="italic" font-weight="bold">13: confirme(statut="resolu", duree_coupure=432s)</text>

    <!-- Message 14 : Fermeture sur la Page Web -->
    <line x1="327" y1="745" x2="863" y2="745" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-sync)"/>
    <text x="345" y="739" fill="#000000" font-size="12" font-weight="bold">14: cloturerIncidentWeb(id_web, "Service rétabli et nominal")</text>

    <!-- Message 15 : Notification Résolution WhatsApp -->
    <line x1="327" y1="795" x2="1033" y2="795" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-sync)"/>
    <text x="345" y="789" fill="#16a34a" font-size="12" font-weight="bold">15: envoyerMessageWhatsApp(template="incident_resolu", duree="7 min 12 s")</text>

</svg>
