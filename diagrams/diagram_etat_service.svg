<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Segoe UI', Calibri, Arial, sans-serif;">
    <defs>
        <!-- Filtre ombre douce  -->
        <filter id="shadow-state-srv" x="-10%" y="-10%" width="130%" height="130%">
            <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.12"/>
        </filter>

        <!-- Marqueur Flèche de Transition -->
        <marker id="arrow-tr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
            <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#000000"/>
        </marker>
    </defs>

    <!-- CADRE GÉNÉRAL DU DIAGRAMME D'ÉTATS-TRANSITIONS POWERAMC -->
    <rect x="20" y="20" width="1160" height="660" rx="10" ry="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow-state-srv)"/>
    
    <!-- BANDEAU DE TITRE UML POWERAMC -->
    <path d="M 20 20 L 600 20 L 625 48 L 600 48 L 20 48 Z" fill="#0020B2"/>
    <text x="35" y="37" fill="#ffffff" font-size="14" font-weight="bold" letter-spacing="0.5">
        stm : Disponibilité d'un Service Partenaire dans VigilCore
    </text>

    <!-- ========================================================================= -->
    <!-- 1. ÉTAT INITIAL (Disque noir plein)                                       -->
    <!-- Position: cx=65, cy=180, r=14                                             -->
    <!-- ========================================================================= -->
    <circle cx="65" cy="180" r="14" fill="#000000"/>

    <!-- Transition Initiale vers État Opérationnel -->
    <line x1="80" y1="180" x2="168" y2="180" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-tr-s)"/>
    <text x="80" y="152" fill="#0020B2" font-size="11.5" font-weight="bold">activerService</text>
    <text x="80" y="169" fill="#334155" font-size="10.5">/ initialiserSondesSante()</text>


    <!-- ========================================================================= -->
    <!-- 2. ÉTAT 1 : Opérationnel (Nominal / Vert)                                 -->
    <!-- Position: X=170, Y=120 | L=265, H=125                                     -->
    <!-- ========================================================================= -->
    <g transform="translate(170, 120)" filter="url(#shadow-state-srv)">
        <rect x="0" y="0" width="265" height="125" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
        <rect x="0" y="0" width="265" height="30" rx="12" fill="#16a34a"/>
        <rect x="0" y="18" width="265" height="12" fill="#16a34a"/>
        <text x="132" y="21" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Opérationnel (Nominal - Vert)</text>
        
        <text x="12" y="50" fill="#000000" font-size="11.5">entree / definirStatut('OPERATIONNEL')</text>
        <text x="12" y="70" fill="#000000" font-size="11.5">faire / executerSondeSante30s()</text>
        <text x="12" y="90" fill="#000000" font-size="11.5">faire / cumulerTempsDisponibilite()</text>
        <text x="12" y="110" fill="#000000" font-size="11.5">sortie / noterDebutPerturbation()</text>
    </g>


    <!-- Transition État Opérationnel -> État Dégradé -->
    <path d="M 435 155 L 598 155" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-tr-s)"/>
    <text x="515" y="135" fill="#ca8a04" font-size="11" font-weight="bold" text-anchor="middle">hausseTempsReponse</text>
    <text x="515" y="150" fill="#334155" font-size="10" text-anchor="middle">[latence &gt; 2000ms]</text>

    <!-- Transition Retour Dégradé -> Opérationnel -->
    <path d="M 600 205 L 437 205" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow-tr-s)"/>
    <text x="515" y="222" fill="#16a34a" font-size="11" font-weight="bold" text-anchor="middle">retourTempsNormal</text>
    <text x="515" y="237" fill="#334155" font-size="10" text-anchor="middle">[latence &lt; 500ms]</text>


    <!-- ========================================================================= -->
    <!-- 3. ÉTAT 2 : Dégradé (Ralentissement - Jaune)                              -->
    <!-- Position: X=600, Y=120 | L=265, H=125                                     -->
    <!-- ========================================================================= -->
    <g transform="translate(600, 120)" filter="url(#shadow-state-srv)">
        <rect x="0" y="0" width="265" height="125" rx="12" fill="#fefce8" stroke="#ca8a04" stroke-width="1.8"/>
        <rect x="0" y="0" width="265" height="30" rx="12" fill="#ca8a04"/>
        <rect x="0" y="18" width="265" height="12" fill="#ca8a04"/>
        <text x="132" y="21" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Dégradé (Ralenti - Jaune)</text>
        
        <text x="12" y="50" fill="#000000" font-size="11.5">entree / definirStatut('DEGRADE')</text>
        <text x="12" y="70" fill="#000000" font-size="11.5">faire / emettreAlerteRalentissement()</text>
        <text x="12" y="90" fill="#000000" font-size="11.5">faire / resserrerTestsA10s()</text>
        <text x="12" y="110" fill="#000000" font-size="11.5">sortie / evaluerImpactDisponibilite()</text>
    </g>


    <!-- Transition Dégradé -> Panne Majeure (Vers le bas) -->
    <path d="M 730 245 L 730 388" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow-tr-s)"/>
    <text x="740" y="295" fill="#dc2626" font-size="11.5" font-weight="bold">ruptureTotale</text>
    <text x="740" y="312" fill="#334155" font-size="10">[erreurs_serveur ou delai_depasse]</text>
    <text x="740" y="328" fill="#334155" font-size="10">/ ouvrirIncidentCritique()</text>


    <!-- Transition directe Opérationnel -> Panne Majeure -->
    <path d="M 300 245 L 300 440 L 598 440" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow-tr-s)"/>
    <text x="310" y="340" fill="#dc2626" font-size="11" font-weight="bold">panneBrutale [reponse_nulle]</text>


    <!-- ========================================================================= -->
    <!-- 4. ÉTAT 3 : Panne Majeure (Coupure - Rouge)                               -->
    <!-- Position: X=600, Y=390 | L=275, H=135                                     -->
    <!-- ========================================================================= -->
    <g transform="translate(600, 390)" filter="url(#shadow-state-srv)">
        <rect x="0" y="0" width="275" height="135" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
        <rect x="0" y="0" width="275" height="30" rx="12" fill="#dc2626"/>
        <rect x="0" y="18" width="275" height="12" fill="#dc2626"/>
        <text x="137" y="21" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Panne Majeure (Coupure - Rouge)</text>
        
        <text x="12" y="50" fill="#000000" font-size="11.5">entree / definirStatut('PANNE')</text>
        <text x="12" y="69" fill="#000000" font-size="11.5">entree / incrementerCompteurCoupures()</text>
        <text x="12" y="88" fill="#000000" font-size="11.5">faire / actualiserPageWeb('panne_majeure')</text>
        <text x="12" y="107" fill="#000000" font-size="11.5">faire / envoyerWhatsAppUrgence()</text>
        <text x="12" y="126" fill="#000000" font-size="11.5">sortie / recalculerTempsCoupureSec()</text>
    </g>


    <!-- Transition Retour Panne Majeure -> Opérationnel (Rétablissement) -->
    <path d="M 600 480 L 220 480 L 220 247" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow-tr-s)"/>
    <text x="370" y="470" fill="#16a34a" font-size="11.5" font-weight="bold" text-anchor="middle">retablissementService [succes_3_tests_consecutifs]</text>
    <text x="370" y="495" fill="#334155" font-size="10.5" text-anchor="middle">/ cloreIncident() &amp; publierRetourNominal()</text>


    <!-- ========================================================================= -->
    <!-- 5. ÉTAT 4 : Maintenance Programmée (Bleu)                                 -->
    <!-- Position: X=930, Y=260 | L=235, H=125                                     -->
    <!-- ========================================================================= -->
    <g transform="translate(930, 260)" filter="url(#shadow-state-srv)">
        <rect x="0" y="0" width="235" height="125" rx="12" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.8"/>
        <rect x="0" y="0" width="235" height="30" rx="12" fill="#0284c7"/>
        <rect x="0" y="18" width="235" height="12" fill="#0284c7"/>
        <text x="117" y="21" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Maintenance (Bleu)</text>
        
        <text x="12" y="50" fill="#000000" font-size="11.5">entree / definirStatut('MAINTENANCE')</text>
        <text x="12" y="70" fill="#000000" font-size="11.5">entree / suspendrePenalites()</text>
        <text x="12" y="90" fill="#000000" font-size="11.5">faire / afficherBanniereInformation()</text>
        <text x="12" y="110" fill="#000000" font-size="11.5">sortie / reactiverCalculDisponibilite()</text>
    </g>

    <!-- Transition Opérationnel -> Maintenance -->
    <path d="M 400 120 L 400 85 L 1040 85 L 1040 258" fill="none" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arrow-tr-s)"/>
    <text x="720" y="75" fill="#0284c7" font-size="11" font-weight="bold" text-anchor="middle">debutFenetreMaintenance [heure_programmee] / desactiverAlertes()</text>

    <!-- Transition Maintenance -> Opérationnel -->
    <path d="M 1000 385 L 1000 590 L 190 590 L 190 247" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow-tr-s)"/>
    <text x="590" y="580" fill="#16a34a" font-size="11" font-weight="bold" text-anchor="middle">finMaintenance / verifierEtatEtRepasserNominal()</text>


    <!-- ========================================================================= -->
    <!-- 6. ÉTAT FINAL : Retiré du Catalogue                                       -->
    <!-- Position: cx=1060, cy=480                                                 -->
    <!-- ========================================================================= -->
    <circle cx="1060" cy="480" r="16" fill="none" stroke="#000000" stroke-width="2"/>
    <circle cx="1060" cy="480" r="10" fill="#000000"/>

    <!-- Transition vers État Final (TRAIT PLEIN NORME UML) -->
    <line x1="875" y1="460" x2="1042" y2="475" stroke="#000000" stroke-width="1.8" marker-end="url(#arrow-tr-s)"/>
    <text x="960" y="450" fill="#000000" font-size="10.5" font-weight="bold" text-anchor="middle">retirerDuCatalogue()</text>

</svg>
