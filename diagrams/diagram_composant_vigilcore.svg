        <text x="130" y="55" fill="#000000" font-size="14.5" font-weight="bold" text-anchor="middle">Cmp_InterfaceSupervision</text>
        <text x="130" y="74" fill="#1e293b" font-size="11" text-anchor="middle">Tableau de bord en direct</text>
    </g>

