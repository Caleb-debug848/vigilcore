            <rect x="0" y="3" width="7" height="3.5" rx="0.5" fill="#74abf8" stroke="#000000" stroke-width="0.9"/>
            <rect x="0" y="8.5" width="7" height="3.5" rx="0.5" fill="#74abf8" stroke="#000000" stroke-width="0.9"/>
        </g>
        <text x="130" y="36" fill="#000000" font-size="12" text-anchor="middle">«composant»</text>
        <text x="130" y="57" fill="#000000" font-size="14.5" font-weight="bold" text-anchor="middle">Cmp_CalculDisponibilite</text>
        <text x="130" y="77" fill="#1e293b" font-size="11" text-anchor="middle">Calcul du taux de 99.9%</text>
    </g>

    <!-- C7 : Cmp_GenerateurRapports (MILIEU DROITE) -->
    <g transform="translate(1270, 380)" filter="url(#shadow-poweramc-card)">
        <rect x="0" y="0" width="260" height="95" rx="5" ry="5" fill="#74abf8" stroke="#000000" stroke-width="1.4"/>
        <g transform="translate(226, 10)">
            <rect x="5" y="0" width="18" height="15" rx="1.5" fill="#74abf8" stroke="#000000" stroke-width="1.1"/>
            <rect x="0" y="3" width="7" height="3.5" rx="0.5" fill="#74abf8" stroke="#000000" stroke-width="0.9"/>
