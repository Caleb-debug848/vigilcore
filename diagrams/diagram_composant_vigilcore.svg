        <text x="120" y="77" fill="#1e293b" font-size="11" text-anchor="middle">Export Excel 12 col &amp; PDF</text>
    </g>


    <!-- ================================================================= -->
    <!-- TIER 3 : PERSISTANCE & PREUVES D'AUDIT (BAS, Y = 670, H = 90)     -->
    <!-- ================================================================= -->

    <!-- C8 : Cmp_ArchivagePreuves (BAS CENTRE-GAUCHE) -->
    <g transform="translate(430, 670)" filter="url(#shadow-poweramc-card)">
        <rect x="0" y="0" width="280" height="90" rx="5" ry="5" fill="#74abf8" stroke="#000000" stroke-width="1.4"/>
