        <text x="130" y="74" fill="#1e293b" font-size="11" text-anchor="middle">Base PostgreSQL &amp; Redis</text>
    </g>


    <!-- ================================================================= -->
    <!-- ASSEMBLAGES EXACTS POWERAMC : BALL-AND-SOCKET (——○)——)            -->
    <!-- ================================================================= -->

    <!-- 1. ISondeSurveillance (Horizontale pure entre Cmp_MoteurSurveillance et Cmp_GestionIncidents) -->
    <line x1="310" y1="427" x2="365" y2="427" stroke="#000000" stroke-width="1.6"/>
    <circle cx="365" cy="427" r="7" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <path d="M 365 415 A 12 12 0 0 1 365 439" fill="none" stroke="#000000" stroke-width="2.2"/>
    <line x1="430" y1="427" x2="377" y2="427" stroke="#000000" stroke-width="1.6"/>
    <text x="370" y="405" fill="#000000" font-size="12.5" font-weight="bold" text-anchor="middle">ISondeSurveillance</text>

    <!-- 2. IGestionIncidents (Verticale pure entre Cmp_GestionIncidents et Cmp_InterfaceSupervision) -->
    <line x1="570" y1="380" x2="570" y2="280" stroke="#000000" stroke-width="1.6"/>
    <circle cx="570" cy="280" r="7" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <path d="M 558 280 A 12 12 0 0 1 582 280" fill="none" stroke="#000000" stroke-width="2.2"/>
    <line x1="570" y1="170" x2="570" y2="268" stroke="#000000" stroke-width="1.6"/>
    <text x="595" y="285" fill="#000000" font-size="13" font-weight="bold">IGestionIncidents</text>

    <!-- 3. ICalculDisponibilite (Verticale pure entre Cmp_CalculDisponibilite et Cmp_PortailConsultation) -->
    <line x1="1010" y1="380" x2="1010" y2="280" stroke="#000000" stroke-width="1.6"/>
    <circle cx="1010" cy="280" r="7" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <path d="M 998 280 A 12 12 0 0 1 1022 280" fill="none" stroke="#000000" stroke-width="2.2"/>
    <line x1="1010" y1="170" x2="1010" y2="268" stroke="#000000" stroke-width="1.6"/>
    <text x="1035" y="285" fill="#000000" font-size="13" font-weight="bold">ICalculDisponibilite</text>

    <!-- 4. IExportRapports (Horizontale pure entre Cmp_GenerateurRapports et Cmp_CalculDisponibilite) -->
    <line x1="1270" y1="427" x2="1215" y2="427" stroke="#000000" stroke-width="1.6"/>
    <circle cx="1215" cy="427" r="7" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <path d="M 1215 415 A 12 12 0 0 0 1215 439" fill="none" stroke="#000000" stroke-width="2.2"/>
    <line x1="1150" y1="427" x2="1203" y2="427" stroke="#000000" stroke-width="1.6"/>
    <text x="1210" y="405" fill="#000000" font-size="12.5" font-weight="bold" text-anchor="middle">IExportRapports (Excel / PDF)</text>

    <!-- 5. INotifAlerte (Orthogonale parfaite sans croisement entre Cmp_ServiceAlertes et Cmp_GestionIncidents) -->
    <path d="M 180 170 L 180 275 L 340 275" fill="none" stroke="#000000" stroke-width="1.6"/>
    <circle cx="340" cy="275" r="7" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <path d="M 340 263 A 12 12 0 0 1 340 287" fill="none" stroke="#000000" stroke-width="2.2"/>
    <path d="M 450 380 L 450 275 L 352 275" fill="none" stroke="#000000" stroke-width="1.6"/>
    <text x="340" y="252" fill="#000000" font-size="12.5" font-weight="bold" text-anchor="middle">INotifAlerte (WhatsApp)</text>

    <!-- 6. IPreuvesIncidents (Verticale pure entre Cmp_ArchivagePreuves et Cmp_GestionIncidents) -->
    <line x1="510" y1="670" x2="510" y2="560" stroke="#000000" stroke-width="1.6"/>
    <circle cx="510" cy="560" r="7" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <path d="M 498 560 A 12 12 0 0 1 522 560" fill="none" stroke="#000000" stroke-width="2.2"/>
    <line x1="510" y1="475" x2="510" y2="548" stroke="#000000" stroke-width="1.6"/>
    <text x="530" y="565" fill="#000000" font-size="13" font-weight="bold">IPreuvesIncidents</text>

    <!-- 7. IAccesDonnees (Verticale + Raccordement propre en T au-dessus de la prise) -->
    <line x1="1010" y1="670" x2="1010" y2="560" stroke="#000000" stroke-width="1.6"/>
    <circle cx="1010" cy="560" r="7" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <path d="M 998 560 A 12 12 0 0 1 1022 560" fill="none" stroke="#000000" stroke-width="2.2"/>
    <line x1="1010" y1="475" x2="1010" y2="548" stroke="#000000" stroke-width="1.6"/>
