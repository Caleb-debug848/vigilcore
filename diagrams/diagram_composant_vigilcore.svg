<svg id="svg-composant" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1580 820" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Segoe UI', Calibri, Arial, sans-serif;">
    <defs>
        <filter id="shadow-poweramc-card" x="-5%" y="-5%" width="115%" height="115%">
            <feDropShadow dx="2" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.12"/>
        </filter>
    </defs>

    <!-- CADRE GÉNÉRAL DU DIAGRAMME POWERAMC -->
    <rect x="15" y="15" width="1550" height="790" rx="6" ry="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow-poweramc-card)"/>
    
    <!-- BANDEAU DE TITRE UML POWERAMC -->
    <path d="M 15 15 L 750 15 L 775 48 L 750 48 L 15 48 Z" fill="#0020B2"/>
    <text x="30" y="36" fill="#ffffff" font-size="15" font-weight="bold" letter-spacing="0.5">
        cmp : Diagramme de Composants Logiciels du Système VigilCore
    </text>


    <!-- ================================================================= -->
    <!-- TIER 1 : COUCHE PRÉSENTATION & ALERTES (HAUT, Y = 80, H = 90)     -->
    <!-- ================================================================= -->

    <!-- C3 : Cmp_ServiceAlertes (HAUT GAUCHE) -->
    <g transform="translate(50, 80)" filter="url(#shadow-poweramc-card)">
        <rect x="0" y="0" width="260" height="90" rx="5" ry="5" fill="#74abf8" stroke="#000000" stroke-width="1.4"/>
        <g transform="translate(226, 10)">
            <rect x="5" y="0" width="18" height="15" rx="1.5" fill="#74abf8" stroke="#000000" stroke-width="1.1"/>
            <rect x="0" y="3" width="7" height="3.5" rx="0.5" fill="#74abf8" stroke="#000000" stroke-width="0.9"/>
            <rect x="0" y="8.5" width="7" height="3.5" rx="0.5" fill="#74abf8" stroke="#000000" stroke-width="0.9"/>
        </g>
        <text x="120" y="34" fill="#000000" font-size="12" text-anchor="middle">«composant»</text>
        <text x="120" y="55" fill="#000000" font-size="14.5" font-weight="bold" text-anchor="middle">Cmp_ServiceAlertes</text>
        <text x="120" y="74" fill="#1e293b" font-size="11" text-anchor="middle">Envoi alertes WhatsApp</text>
    </g>

    <!-- C1 : Cmp_InterfaceSupervision (HAUT CENTRE-GAUCHE) -->
    <g transform="translate(430, 80)" filter="url(#shadow-poweramc-card)">
        <rect x="0" y="0" width="280" height="90" rx="5" ry="5" fill="#74abf8" stroke="#000000" stroke-width="1.4"/>
        <g transform="translate(246, 10)">
